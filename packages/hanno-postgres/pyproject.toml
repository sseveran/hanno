[project]
name = "hanno-postgres"
version = "0.1.0"
requires-python = ">=3.12"
description = "Workflow Ledger: Postgres storage backend"
license = "BSD-3-Clause"
dependencies = [
    "hanno-core",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "sqlalchemy[asyncio]>=2.0",
]

[tool.uv.sources]
hanno-core = { workspace = true }

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
