[project]
name = "hanno-core"
version = "0.1.0"
requires-python = ">=3.12"
description = "Workflow Ledger: core domain models, interfaces, and SQLite backend"
license = "BSD-3-Clause"
dependencies = [
    "pydantic>=2.10",
    "aiosqlite>=0.21",
    "python-ulid>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
